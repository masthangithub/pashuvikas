<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="content">
  <main id="main">
    <p class="subtitle">Loading…</p>
  </main>
  </div>
</div>
<script src="/nav.js"></script>
<script>
function esc(v) { return v == null ? '—' : String(v); }
function statusTag(s) { return '<span class="tag status-' + s + '">' + s.replace('_',' ') + '</span>'; }
const id = new URLSearchParams(location.search).get('id');
async function load() {
  if (!id) { document.getElementById('main').innerHTML = '<div class="empty">No buffalo selected. <a href="/buffaloes.html">Back to buffaloes</a></div>'; return; }
  const [buffalo, assessments, visits] = await Promise.all([
    fetch('/api/buffaloes/' + id).then(r => r.json()),
    fetch('/api/assessments?buffalo_id=' + id).then(r => r.json()),
    fetch('/api/visits?buffalo_id=' + id).then(r => r.json())
  ]);
  if (buffalo.error) { document.getElementById('main').innerHTML = '<div class="empty">Buffalo not found. <a href="/buffaloes.html">Back to buffaloes</a></div>'; return; }
  document.getElementById('main').innerHTML =
    '<div class="page-head"><div><h1 class="pg">' + esc(buffalo.tag_id || '(untagged)') + '</h1><p class="subtitle">' + esc(buffalo.breed) + ' · owned by <a href="/farmer.html?id=' + buffalo.farmer_id + '">' + esc(buffalo.farmer_name) + '</a></p></div>' +
    '<a class="btn ghost" href="/buffaloes.html">Back to buffaloes</a></div>' +
    '<div class="profile-grid"><div class="photo-placeholder lg">' + esc(buffalo.breed).toUpperCase() + '<br/>PHOTO PLACEHOLDER</div>' +
    '<dl class="kv"><dt>Ear tag</dt><dd>' + esc(buffalo.tag_id) + '</dd>' +
    '<dt>Breed</dt><dd>' + esc(buffalo.breed) + '</dd>' +
    '<dt>Date of birth</dt><dd>' + esc(buffalo.dob) + '</dd>' +
    '<dt>Colour</dt><dd>' + esc(buffalo.color) + '</dd>' +
    '<dt>Notes</dt><dd>' + esc(buffalo.notes) + '</dd>' +
    '<dt>Registered</dt><dd>' + esc(buffalo.created_at) + '</dd></dl></div>' +
    '<div class="page-head"><h2>Visits</h2><a class="btn ghost" href="/visit-schedule.html">+ Schedule visit</a></div>' +
    (visits.length ? '<table><thead><tr><th>Doctor</th><th>Type</th><th>Status</th><th>Date</th></tr></thead><tbody>' +
      visits.map(v => '<tr><td>' + (v.doctor_id ? '<a href="/doctor.html?id=' + v.doctor_id + '">' + esc(v.doctor_name) + '</a>' : '—') + '</td><td>' + esc(v.visit_type) + '</td><td>' + statusTag(v.status) + '</td><td>' + esc(v.scheduled_date) + '</td></tr>').join('') +
      '</tbody></table>' : '<div class="empty">No visits scheduled yet.</div>') +
    '<div class="page-head"><h2>Health history</h2><a class="btn" href="/health-assessment.html">+ New assessment</a></div>' +
    '<ul class="timeline">' + (assessments.length ? assessments.map(a =>
      '<li><div class="date">' + esc(a.created_at) + '</div><div class="t">Assessed by ' + (a.doctor_id ? '<a href="/doctor.html?id=' + a.doctor_id + '">' + esc(a.assessed_by) + '</a>' : esc(a.assessed_by)) + '</div>' +
      '<div class="d">Weight ' + esc(a.weight_kg) + ' kg · Temp ' + esc(a.temperature_c) + '°C' + (a.follow_up_date ? ' · Follow-up ' + esc(a.follow_up_date) : '') + (a.notes ? '<br/>' + esc(a.notes) : '') + '</div></li>'
    ).join('') : '<li class="empty">No health assessments recorded yet.</li>') + '</ul>';
}
load();
</script>
</body>
</html>
